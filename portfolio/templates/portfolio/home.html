{% extends "portfolio/base.html" %}
{% load static %}

{% block content %}
  <section class="hero section">
    <div class="hero-copy">
      <p class="eyebrow">{{ profile.location }}</p>
      <h1>{{ profile.role }}</h1>
      <p class="lead">{{ profile.summary }}</p>
      <div class="hero-actions">
        <a class="button primary" href="{% url 'portfolio:contact' %}">Contactar</a>
        <a class="button secondary" href="{{ profile.linkedin }}" target="_blank" rel="noreferrer">LinkedIn</a>
        <a class="button ghost" href="{% static 'portfolio/files/cv-ezequiel-gusman.pdf' %}" target="_blank" rel="noreferrer">CV</a>
      </div>
    </div>
    <aside class="hero-panel" aria-label="Especialidades">
      {% for item in highlights %}
        <span>{{ item }}</span>
      {% endfor %}
    </aside>
  </section>
{% endblock %}
