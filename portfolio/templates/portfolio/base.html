{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio de {{ profile.name }}, {{ profile.role }} en Cordoba, Argentina.">
  <title>{% block title %}{{ profile.name }} | Backend Developer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'portfolio/css/styles.css' %}">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-python" viewBox="0 0 48 48">
      <path d="M24 4c-8 0-11 3-11 8v4h12v3H8c-4 0-6 3-6 7v4c0 4 3 7 7 7h4v-6c0-5 4-8 9-8h8c4 0 7-3 7-7v-4c0-5-5-8-13-8Zm-6 6a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/>
      <path d="M24 44c8 0 11-3 11-8v-4H23v-3h17c4 0 6-3 6-7v-4c0-4-3-7-7-7h-4v6c0 5-4 8-9 8h-8c-4 0-7 3-7 7v4c0 5 5 8 13 8Zm6-6a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>
    </symbol>
    <symbol id="icon-django" viewBox="0 0 48 48">
      <path d="M15 8h8v25c-3 2-6 3-10 3-7 0-11-4-11-11 0-8 5-13 13-13V8Zm0 11c-3 0-5 2-5 6 0 3 2 5 5 5V19Z"/>
      <path d="M29 8h8v7h-8V8Zm0 10h8v18c0 7-4 11-12 12l-2-6c4-1 6-3 6-7V18Z"/>
    </symbol>
    <symbol id="icon-mysql" viewBox="0 0 48 48">
      <path d="M5 30c0-8 8-15 18-15 8 0 15 4 18 10-3-3-8-5-14-5-10 0-18 5-18 12 0 4 3 7 8 9-7-1-12-5-12-11Z"/>
      <path d="M29 11c6-5 11-6 15-4-2 1-4 3-5 6 2 1 4 3 5 5-4-1-8-2-13-2-2 0-4 0-6 1 1-2 2-4 4-6Z"/>
      <path d="M15 31c3-4 9-6 17-5 4 1 7 2 10 4-3 4-9 7-18 7-4 0-7-1-9-3v-3Z"/>
    </symbol>
    <symbol id="icon-linkedin" viewBox="0 0 24 24">
      <path d="M5 8h4v12H5V8Zm2-5a2.3 2.3 0 1 1 0 4.6A2.3 2.3 0 0 1 7 3Zm4 5h4v2c.7-1.3 2-2.3 4-2.3 3 0 5 2 5 6V20h-4v-6c0-1.8-.8-2.8-2.3-2.8-1.6 0-2.7 1.1-2.7 3V20h-4V8Z"/>
    </symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24">
      <path d="M3 6h18v12H3V6Zm2 3v7h14V9l-7 5-7-5Zm1-1 6 4 6-4H6Z"/>
    </symbol>
    <symbol id="icon-phone" viewBox="0 0 24 24">
      <path d="M6 3h7l1 5-3 2c1 2 3 4 5 5l2-3 5 1v7c0 1-1 2-2 2C10 22 2 14 2 5c0-1 1-2 2-2h2Z"/>
    </symbol>
  </svg>
  <header class="site-header">
    <a class="brand" href="{% url 'portfolio:home' %}">{{ profile.name }}</a>
    <nav aria-label="Principal">
      <a class="{% if active == 'experience' %}active{% endif %}" href="{% url 'portfolio:experience' %}">Experiencia</a>
      <a class="{% if active == 'projects' %}active{% endif %}" href="{% url 'portfolio:projects' %}">Proyectos</a>
      <a class="{% if active == 'stack' %}active{% endif %}" href="{% url 'portfolio:stack' %}">Stack</a>
      <a class="{% if active == 'contact' %}active{% endif %}" href="{% url 'portfolio:contact' %}">Contacto</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
